# EDUFARM API — OpenAPI 3.0 specification (generated from source, verified).
# Covers every implemented endpoint. Conventions shared by all operations are
# documented once here; per-operation x-edufarm blocks record roles, rate
# limits, idempotency, side effects and audit behaviour. Planned-but-missing
# endpoints are listed at the bottom under x-planned and NOT as paths.
openapi: 3.0.3
info:
  title: EDUFARM API
  version: 1.0.0
  description: >-
    Verified lecturer–student learning ecosystem (local-first).
    Auth: opaque session token via `Authorization: Bearer <token>`,
    `x-session-token` header, or `edufarm_session` cookie. Raw user ids are
    never accepted. Error shape is ALWAYS `{ "error": "<code>: <message>" }`
    (4xx pass through; 5xx are sanitized to `{ "error": "internal", "id" }`
    with the trace server-side only). Global rate limit is 300 req/min;
    stricter budgets are noted per operation.
servers:
  - url: http://localhost:4000
    description: Local device (PM2 edufarm-api)
security:
  - bearerAuth: []
  - sessionToken: []
  - sessionCookie: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token (preferred).
    sessionToken:
      type: apiKey
      in: header
      name: x-session-token
    sessionCookie:
      type: apiKey
      in: cookie
      name: edufarm_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: "auth-invalid: email + password required."
    Id:
      type: string
      description: cuid identifier
    VerificationStatus:
      type: string
      enum: [unverified, pending, needsCorrection, verified, rejected, suspended]
    EnrollmentStatus:
      type: string
      enum: [requested, approved, rejected, removed, suspended]
    MaterialStatus:
      type: string
      enum: [draft, pendingLecturer, pendingReview, published, archived]
    PurchaseStatus:
      type: string
      enum: [pending, completed, failed, refunded, revoked, suspended]
    PaymentOrderStatus:
      type: string
      enum: [pending, processing, paid, failed, expired, cancelled]
    DisputeStatus:
      type: string
      enum: [open, under-review, resolved, dismissed, appealed, closed]
    PublicUser:
      type: object
      description: User row minus passwordHash, plus profile(s) and session token on auth responses.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string, nullable: true }
        email: { type: string }
        role: { type: string, enum: [student, lecturer, deptAdmin, institutionAdmin, platformAdmin] }
        suspended: { type: boolean }
        sessionToken: { type: string }
        sessionExpiresAt: { type: string, format: date-time }
    Course:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        departmentId: { type: string }
        levelId: { type: string }
        code: { type: string }
        title: { type: string }
        isOfficial: { type: boolean }
    Material:
      type: object
      description: Never includes fileKey/checksum.
      properties:
        id: { $ref: '#/components/schemas/Id' }
        courseId: { type: string }
        title: { type: string }
        type: { type: string }
        description: { type: string, nullable: true }
        priceKobo: { type: integer }
        isFree: { type: boolean }
        accessDurationDays: { type: integer, nullable: true }
        version: { type: integer }
        status: { $ref: '#/components/schemas/MaterialStatus' }
    Announcement:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        courseId: { type: string }
        lecturerId: { type: string }
        category: { type: string }
        title: { type: string }
        body: { type: string }
        isUrgent: { type: boolean }
        archived: { type: boolean }
        createdAt: { type: string, format: date-time }
    Question:
      type: object
      properties:
        id: { type: string }
        courseId: { type: string }
        title: { type: string }
        body: { type: string }
        status: { type: string, enum: [unanswered, answered, resolved] }
    Notification:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        link: { type: string, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
tags:
  - { name: system, description: Liveness, readiness, demo gate }
  - { name: auth, description: Signup, login, sessions, staff provisioning }
  - { name: hierarchy, description: University → Faculty → Department → Level → Course + lecturer assignment }
  - { name: verification, description: Student/lecturer onboarding state machine }
  - { name: enrollments, description: Lecturer-controlled course access }
  - { name: announcements, description: Official course announcements }
  - { name: qa, description: Course Q&A (no 1-to-1 chat) }
  - { name: materials, description: Lifecycle, search, reader, terms }
  - { name: storage, description: Signed page-token resolution }
  - { name: purchases, description: Legacy checkout shim, bundles, library, earnings }
  - { name: payments, description: Order pipeline, webhooks, reconciliation }
  - { name: progress, description: Dwell pings, completion, continue, inbox }
  - { name: notifications, description: Preferences, read state, reminders }
  - { name: email, description: Outbox, retry, drain }
  - { name: assessments, description: Builder, attempts, grading, release }
  - { name: points, description: Academic points economy }
  - { name: grades, description: Private student CGPA calculator }
  - { name: reviews, description: Eligible reviews, replies, moderation }
  - { name: disputes, description: Reports, lifecycle, appeals }
  - { name: ai, description: Grounded assistant, backfill, insights }
  - { name: devotional, description: Daily Word, archive, curation }
  - { name: onboarding, description: Institution onboarding }
  - { name: settlement, description: eSpees accounting (not a payment rail) }
paths:
  /health:
    get:
      tags: [system]
      security: []
      summary: Liveness (fast, no DB touch)
      responses:
        '200':
          description: Alive with uptime/heap.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  service: { type: string }
                  uptimeSec: { type: integer }
                  memoryMB: { type: integer }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: none, sideEffects: none, audit: none }
  /ready:
    get:
      tags: [system]
      security: []
      summary: Readiness (DB ping + pending-migration count + cache stats)
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  dbMs: { type: integer }
                  uptimeSec: { type: integer }
                  memoryMB: { type: integer }
        '503':
          description: Not ready (db-unreachable or migrations-pending).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ready: { type: boolean }
                  reason: { type: string, enum: [db-unreachable, migrations-pending] }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: none, sideEffects: none, audit: none }
  /api/v1/demo/login:
    post:
      tags: [system]
      security: []
      summary: Passwordless demo login (LOCAL demos only; 403 unless ALLOW_DEMO_LOGIN=true)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '200':
          description: PublicUser + sessionToken + cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '400': { description: 'Missing email.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Demo gate closed.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Unknown email (or suspended).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [public-gated], rateLimit: auth-strict-30/min, idempotency: new-session-per-call, sideEffects: [session-create, Set-Cookie], audit: none }
  /api/v1/demo/users:
    get:
      tags: [system]
      security: []
      summary: List demo users (email/name/role only; same demo gate)
      responses:
        '200': { description: 'User list.' }
        '403': { description: 'Demo gate closed.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [public-gated], rateLimit: global, idempotency: none, sideEffects: none, audit: none }
  /api/v1/auth/signup:
    post:
      tags: [auth]
      security: []
      summary: Role-aware signup (student links full chain; lecturer links department)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [student, lecturer] }
                universityId: { type: string }
                facultyId: { type: string }
                departmentId: { type: string }
                levelId: { type: string }
                matricNo: { type: string }
                staffId: { type: string }
                bio: { type: string }
      responses:
        '200': { description: 'PublicUser + sessionToken + cookie; profile created pending.' }
        '400': { description: 'auth-invalid (fields/chain/department) or auth-taken (email/matric/staffId clash).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [public], rateLimit: auth-strict-10/min, idempotency: email-unique, sideEffects: [profile-create, verification-record, session-create, Set-Cookie], audit: student.signup|lecturer.signup }
  /api/v1/auth/login:
    post:
      tags: [auth]
      security: []
      summary: Email + password login (suspended accounts blocked)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: 'PublicUser + sessionToken + cookie.' }
        '400': { description: 'Missing fields.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Bad credentials (never reveals which field).', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Account suspended.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [public], rateLimit: auth-strict-10/min, idempotency: new-session-per-call, sideEffects: [session-create, Set-Cookie], audit: auth.login|auth.login.failed|auth.login.blocked-suspended }
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Invalidate current session, clear cookie
      responses:
        '200': { description: "{ ok: true } even when already logged out." }
      x-edufarm: { roles: [signed-in-optional], rateLimit: global, idempotency: safe-retry, sideEffects: [session-revoke, cookie-clear], audit: auth.logout }
  /api/v1/auth/session:
    get:
      tags: [auth]
      summary: Current session user (refreshes sliding expiry)
      responses:
        '200': { description: 'PublicUser (no password hash, ever).' }
        '401': { description: 'Missing/invalid/expired/suspended session.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [any-signed-in], rateLimit: global, idempotency: read-only, sideEffects: [sliding-expiry-refresh], audit: none }
  /api/v1/auth/password:
    post:
      tags: [auth]
      summary: Change password (revokes ALL sessions, issues fresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: "{ ok, sessionToken, sessionExpiresAt } + cookie." }
        '400': { description: 'Missing/short fields.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Wrong current password.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [any-signed-in], rateLimit: global, idempotency: non-idempotent, sideEffects: [password-change, revoke-all-sessions, new-session, Set-Cookie], audit: auth.password.changed }
  /api/v1/admin/users/{id}/suspend:
    post:
      tags: [auth]
      summary: Suspend user (kills sessions immediately)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: "{ ok, sessionsRevoked }." }
        '400': { description: 'Cannot suspend yourself.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [platformAdmin], rateLimit: global, idempotency: state-set, sideEffects: [suspend, revoke-all-sessions], audit: admin.user.suspended }
  /api/v1/admin/users/{id}/unsuspend:
    post:
      tags: [auth]
      summary: Unsuspend user
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: "{ ok: true }." }
      x-edufarm: { roles: [platformAdmin], rateLimit: global, idempotency: state-set, sideEffects: [unsuspend], audit: admin.user.unsuspended }
  /api/v1/access-requests:
    post:
      tags: [auth]
      security: []
      summary: Public admin-access request (lands in disputes queue as AccessRequest)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, reason]
              properties:
                name: { type: string }
                email: { type: string }
                role: { type: string }
                reason: { type: string }
      responses:
        '200': { description: 'Dispute row + review note.' }
        '400': { description: 'Missing fields.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: none-each-call-new-row, sideEffects: [dispute-create], audit: none }
  /api/v1/admin/users:
    post:
      tags: [auth]
      summary: Platform admin creates staff accounts directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string, minLength: 8 }
                role: { type: string, enum: [deptAdmin, institutionAdmin, platformAdmin, lecturer, student] }
      responses:
        '200': { description: 'PublicUser created.' }
        '400': { description: 'Invalid fields or email taken.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Platform admin only.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [platformAdmin], rateLimit: global, idempotency: email-unique, sideEffects: [user-create], audit: admin.user.created }
  /api/v1/universities:
    get:
      tags: [hierarchy]
      security: []
      summary: List universities (60s cached; invalidated on write)
      responses:
        '200': { description: 'University array (id/name/slug/verified).' }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: read-only-cached, sideEffects: none, audit: none }
    post:
      tags: [hierarchy]
      summary: Create university
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name: { type: string }
                slug: { type: string }
      responses:
        '200': { description: 'University created.' }
        '400': { description: 'Missing fields or slug taken.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Staff only.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: slug-unique, sideEffects: [cache-invalidate], audit: none }
  /api/v1/universities/{id}/faculties:
    get:
      tags: [hierarchy]
      security: []
      summary: Faculties of a university
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: 'Faculty array.' }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: read-only, sideEffects: none, audit: none }
  /api/v1/faculties:
    post:
      tags: [hierarchy]
      summary: Create faculty under a university (name unique per university)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [universityId, name]
              properties:
                universityId: { type: string }
                name: { type: string }
      responses:
        '200': { description: 'Faculty created.' }
        '400': { description: 'Missing fields or duplicate name.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'University not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: name-unique-per-parent, sideEffects: none, audit: none }
  /api/v1/faculties/{id}/departments:
    get:
      tags: [hierarchy]
      security: []
      summary: Departments of a faculty
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: 'Department array.' }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: read-only, sideEffects: none, audit: none }
  /api/v1/departments:
    post:
      tags: [hierarchy]
      summary: Create department under a faculty (name unique per faculty)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [facultyId, name]
              properties:
                facultyId: { type: string }
                name: { type: string }
      responses:
        '200': { description: 'Department created.' }
        '400': { description: 'Missing fields or duplicate name.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Faculty not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: name-unique-per-parent, sideEffects: none, audit: none }
  /api/v1/departments/{id}/levels:
    get:
      tags: [hierarchy]
      security: []
      summary: Levels of a department
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: 'Level array.' }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: read-only, sideEffects: none, audit: none }
  /api/v1/levels:
    post:
      tags: [hierarchy]
      summary: Create level under a department (name unique per department)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId, name]
              properties:
                departmentId: { type: string }
                name: { type: string, example: "200" }
      responses:
        '200': { description: 'Level created.' }
        '400': { description: 'Missing fields or duplicate name.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Department not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: name-unique-per-parent, sideEffects: none, audit: none }
  /api/v1/departments/{id}/courses:
    get:
      tags: [hierarchy]
      security: []
      summary: Courses of a department (with level + lecturer names)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: 'Course array ordered by code.' }
      x-edufarm: { roles: [public], rateLimit: global, idempotency: read-only, sideEffects: none, audit: none }
  /api/v1/courses:
    post:
      tags: [hierarchy]
      summary: Create course (level must belong to the department — no orphans)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [departmentId, levelId, code, title]
              properties:
                departmentId: { type: string }
                levelId: { type: string }
                code: { type: string, example: BIO 201 }
                title: { type: string }
                isOfficial: { type: boolean }
      responses:
        '200': { description: 'Course created.', content: { application/json: { schema: { $ref: '#/components/schemas/Course' } } } }
        '400': { description: 'Missing fields, cross-department level, or duplicate code.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: code-unique-per-department, sideEffects: none, audit: none }
  /api/v1/courses/{id}:
    get:
      tags: [hierarchy]
      security: []
      summary: Course detail — catalog view for strangers, full content only when entitled
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200':
          description: Catalog (code/title/lecturer names, gated:true) or full course (materials, unarchived announcements, Q&A, gated:false).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Course'
                  - type: object
                    properties:
                      gated: { type: boolean }
        '404': { description: 'Course not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [public-catalog, entitled-full], rateLimit: global, idempotency: read-only, sideEffects: none, audit: none }
  /api/v1/courses/{id}/lecturers:
    get:
      tags: [hierarchy]
      summary: Lecturer assignments of a course
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      responses:
        '200': { description: 'CourseLecturer rows with lecturer + department.' }
        '401': { description: 'Sign-in required.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [any-signed-in], rateLimit: global, idempotency: read-only, sideEffects: none, audit: none }
    post:
      tags: [hierarchy]
      summary: Assign a verified same-department lecturer to a course
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lecturerProfileId]
              properties:
                lecturerProfileId: { type: string }
                role: { type: string, default: owner }
      responses:
        '200': { description: 'CourseLecturer link (upsert).' }
        '400': { description: 'Lecturer unverified or wrong department.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Course or lecturer profile not found.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: upsert-courseId-lecturerId, sideEffects: [notification-to-lecturer], audit: course.lecturer.assigned }
  /api/v1/courses/{id}/lecturers/{lecturerId}:
    delete:
      tags: [hierarchy]
      summary: Unassign lecturer (a course must keep at least one)
      parameters:
        - { $ref: '#/components/parameters/IdParam' }
        - { name: lecturerId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: "{ removed: true }." }
        '400': { description: 'Last lecturer cannot be removed.', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
      x-edufarm: { roles: [deptAdmin, institutionAdmin, platformAdmin], rateLimit: global, idempotency: delete-many-idempotent, sideEffects: none, audit: course.lecturer.unassigned }
  /api/v1/verifications/student:
    post:
      tags: [verification]
      summary: Student verification request/resubmit (full chain enforced)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [universityId, facultyId, departmentId, levelId, matricNo]
              properties:
